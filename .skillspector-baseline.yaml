version: 2

# Scoped suppressions for reviewed false positives only. Each has a written reason.
# Review with: skillspector scan skills/scrum-spec --baseline .skillspector-baseline.yaml --show-suppressed

rules:
  - id: "AE1"
    path: "*SKILL.md"
    reason: "The scanner did not fully inspect scripts/check.py when SKILL.md mentions it. check.py is a 200-line, standard-library, read-only checker (re, sys, pathlib only); no subprocess, no network, no file writes. Reviewed by hand; covered by tests/test_check.py and bandit."
  - id: "LP1"
    path: "*scripts/check.py"
    reason: "check.py reads the Markdown files of the folders passed to it; that is its whole job. allowed-tools only PRE-APPROVES the check.py call so the user is not prompted; reading files needs no extra grant."
  - id: "EA2"
    path: "*"
    reason: "Matched rules about applying an edit that follows a decision a person already made without asking for the same approval twice. Scope, AC and every decision still require a person; the skill never deletes, moves, commits or pushes."
